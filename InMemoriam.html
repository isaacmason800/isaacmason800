<html lang="en">

<head>
    <title>In Memoriam</title>
    <link rel="stylesheet" href="default.css">
</head>

<body>

    <header class="top-banner">

        <div class="site-title">
            <h1>Cheap Chaps Cask</h1>
        </div>

        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="#">Beers</a>
            <a href="#">Taverns</a>
            <a href="#">More</a>
            <a href="#">Contact</a>
        </nav>

        <div class="site-logo">
            <img src="ccclogo.png" alt="Cheap Chaps Cask logo">
        </div>

    </header>


<main class="memoriam">

    <h2>In Memoriam</h2>

    <p>To the brews, brewers and locals lost over the years</p>


    <article class="memorial-entry">

        <div class="memorial-info">
            <h3>Old Brewery Bitter</h3>

            <p>
                A short description of the beer, brewery or local.
            </p>
        </div>


        <div class="memorial-picture">
            <img src="LancashireBestBitter.png" alt="Old Brewery Bitter">
        </div>


        <div class="raise-beer">

            <div class="raise-label">
                Beers raised
            </div>

            <div class="beer-count" id="count-1">
                0
            </div>

            <button
                class="beer-button"
                onclick="raiseBeer(1)">
                <img>Beer.png</img>
            </button>

            <button
                class="raise-text-button"
                onclick="raiseBeer(1)">
                Click here to raise a beer
            </button>

        </div>

    </article>

</main>

<footer>
    <p>&copy; 2026 Cheap Chaps Cask</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL = "https://yzhdxvymqmmokjettsfn.supabase.co";

    const SUPABASE_KEY = "sb_publishable_TXxCuZ1-eOoNmPc15ERRXg_TQRF-knx";

    const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    async function loadBeerCount() {

        const { data, error } = await supabase
            .from("beer_raises")
            .select("count")
            .eq("beer_id", 1)
            .single();


        if (error) {

            console.error("Could not load beer count:", error);

            return;
        }


        document.getElementById("count-1").textContent = data.count;

    }


    async function raiseBeer(beerId) {

        const { data, error } = await supabase
            .rpc("raise_beer", {
                p_beer_id: beerId
            });


        if (error) {

            console.error("Could not raise beer:", error);

            return;
        }


        document.getElementById("count-" + beerId).textContent = data;

    }


    loadBeerCount();

</script>


</body>
</html>
