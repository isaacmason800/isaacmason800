<html lang="en">

<head>
    <title>In Memoriam</title>
    <link rel="stylesheet" href="default.css">
</head>

<body>

    <header class="top-banner">

        <div class="site-title">
            <h1>Cheap Chaps Cask</h1>
        </div>

        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="#">Beers</a>
            <a href="#">Taverns</a>
            <a href="#">More</a>
            <a href="#">Contact</a>
        </nav>

        <div class="site-logo">
            <img src="ccclogo.png" alt="Cheap Chaps Cask logo">
        </div>

    </header>


    <main class="memoriam">

        <h2>In Memoriam</h2>

        <p>To the brews, brewers and locals lost over the years</p>


        <section class="memorial-entry">

            <!-- Beer information -->
            <div class="memorial-info">
                <h3>Name of beer etc</h3>
                <p>
                    Short text here
                </p>
            </div>


            <!-- Picture -->
            <div class="memorial-picture">
                <p>Picture</p>
            </div>


            <!-- Beer raising section -->
            <div class="raise-beer">

                <label>Count of<br>how many times raise a beer<br>button clicked</label>

                <div class="beer-count" id="beerCount">
                    0
                </div>

                <button class="beer-button" onclick="raiseBeer()">
                    <img src="ccclogo.png" alt="Raise a beer">
                </button>

                <button class="raise-text-button" onclick="raiseBeer()">
                    Click here to raise a beer
                </button>

            </div>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 Cheap Chaps Cask</p>
    </footer>


    <script>
        let beerCount = 0;

        function raiseBeer() {
            beerCount++;
            document.getElementById("beerCount").textContent = beerCount;
        }
    </script>

</body>

</html>
